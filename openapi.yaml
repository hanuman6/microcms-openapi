            mediaGroup:
              description: 採用媒体リンク -
                外部媒体に求人を出している場合はこちらに入力してください。拠点や職種でリンクは複数ある場合は名称に入力したテキストがボタンのテキストとして表示されます。
              nullable: true
              type: array
              items:
                $ref: "#/components/schemas/CustomField_Recruit_RecruitmentMedia"
            open:
              description: 募集停止中 - 募集内容を掲載するが応募自体を停止する場合にTrueにしてください
              default: false
              type: boolean
          required:
            - id
            - title
