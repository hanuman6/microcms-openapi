              type: string
              description: コンテンツID
            title:
              description: 職種名
              type: string
            tasks:
              description: 業務内容
              type: string
            requirements:
              description: 応募資格(必須)
              type: string
            welcome:
              description: 応募資格(歓迎)
              nullable: true
              type: string
            location:
              description: 勤務地
              type: array
              items:
                type: string
