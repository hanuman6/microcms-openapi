components:
  securitySchemes:
    XApiKey:
      type: apiKey
      in: header
      name: X-MICROCMS-API-KEY
  schemas:
    MicroCMSContentBase:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
          description: 作成日時 (UTC)
        updatedAt:
          type: string
          format: date-time
          description: 更新日時 (UTC)
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: 公開日時 (UTC)
        revisedAt:
          type: string
          format: date-time
          nullable: true
          description: 改訂日時 (UTC)
      required:
        - createdAt
        - updatedAt
    MicroCMSImage:
      type: object
      description: microCMS 画像オブジェクト
      properties:
        url:
          type: string
          format: uri
          description: 画像URL
        height:
          type: integer
          nullable: true
          description: 画像の高さ (px)
        width:
          type: integer
          nullable: true
          description: 画像の幅 (px)
        alt:
          type: string
          nullable: true
          description: 代替テキスト
      required:
        - url
    MicroCMSFile:
      type: object
      description: microCMS ファイルオブジェクト
      properties:
        url:
          type: string
          format: uri
          description: ファイルURL
        fileSize:
          type: integer
          description: ファイルサイズ (Bytes)
      required:
        - url
    MicroCMSError:
      type: object
      description: microCMS エラーレスポンス
      properties:
        message:
          type: string
          description: エラーメッセージ
      required:
        - message
    CustomField_Config_Access:
      type: object
      description: アクセス
      properties:
        fieldId:
          type: string
          enum:
            - access
          description: カスタムフィールド識別子
        name:
          description: 拠点名
          type: string
        en:
          description: 拠点名(英語1)
          type: string
        en2:
          description: 拠点名(英語2)
          type: string
        address:
          description: 住所
          type: string
        tel:
          description: 電話番号
          type: string
        fax:
          description: FAX
          type: string
        access:
          description: アクセス
          type: string
        map:
          description: Google Map
          type: string
        positionTop:
          description: マップ座標(Top)
          type: number
        positionLeft:
          description: マップ座標(Left)
          type: number
        photo1:
          description: 写真(外観)
          $ref: "#/components/schemas/MicroCMSImage"
        photo2:
          description: 写真(内観)
          $ref: "#/components/schemas/MicroCMSImage"
      required:
        - fieldId
        - name
        - en
        - en2
        - address
        - tel
        - fax
        - access
        - map
        - positionTop
        - positionLeft
        - photo1
        - photo2
    CustomField_Config_Topic:
      type: object
      description: トピック
      properties:
        fieldId:
          type: string
          enum:
            - topic
          description: カスタムフィールド識別子
        message:
          description: トピック
          nullable: true
          type: string
      required:
        - fieldId
    CustomField_Config_Members:
      type: object
      description: ホットさん
      properties:
        fieldId:
          type: string
          enum:
            - members
          description: カスタムフィールド識別子
        name:
          description: 名前(ニックネーム)
          type: string
        title:
          description: 肩書き
          type: string
        icon:
          description: アイコン
          $ref: "#/components/schemas/MicroCMSImage"
        introduction:
          description: 自己紹介
          type: string
        hashtag:
          description: ハッシュタグ
          type: string
      required:
        - fieldId
        - name
        - title
        - icon
        - introduction
        - hashtag
    CustomField_History_History:
      type: object
      description: ホットさんの歴史
      properties:
        fieldId:
          type: string
          enum:
            - history
          description: カスタムフィールド識別子
        year:
          description: 年度(小文字)
          type: number
        yearBig:
          description: 年度(大文字)
          type: number
        head:
          description: 現在も続いているお仕事
          nullable: true
          type: array
          items:
            $ref: "#/components/schemas/CustomField_History_Head"
        projects:
          description: 終了したお仕事
          nullable: true
          type: array
          items:
            $ref: "#/components/schemas/CustomField_History_Projects"
        texts:
          description: その年にあったイベント
          nullable: true
          type: array
          items:
            $ref: "#/components/schemas/CustomField_History_Texts"
      required:
        - fieldId
        - year
        - yearBig
    CustomField_History_Head:
      type: object
      description: 現在も続いているお仕事
      properties:
        fieldId:
          type: string
          enum:
            - head
          description: カスタムフィールド識別子
        position:
          description: ライン行目
          type: number
          minimum: 1
          maximum: 5
        text:
          description: テキスト
          nullable: true
          type: string
      required:
        - fieldId
        - position
    CustomField_History_Projects:
      type: object
      description: 終了したお仕事
      properties:
        fieldId:
          type: string
          enum:
            - projects
          description: カスタムフィールド識別子
        periodStart:
          description: 開始年
          type: number
        periodEnd:
          description: 終了年
          type: number
        position:
          description: ライン行
          type: number
          minimum: 1
          maximum: 11
        background:
          description: 背景色(hex値)
          type: string
          minLength: 3
          maxLength: 6
        text:
          description: テキスト
          type: string
        noRound:
          description: 角丸なし
          default: false
          type: boolean
      required:
        - fieldId
        - periodStart
        - periodEnd
        - position
        - background
        - text
        - noRound
    CustomField_History_Texts:
      type: object
      description: その年にあったイベント
      properties:
        fieldId:
          type: string
          enum:
            - texts
          description: カスタムフィールド識別子
        text:
          description: テキスト
          type: string
      required:
        - fieldId
        - text
    CustomField_Recruit_RecruitmentMedia:
      type: object
      description: 採用媒体リンク
      properties:
        fieldId:
          type: string
          enum:
            - recruitmentMedia
          description: カスタムフィールド識別子
        name:
          description: 名称
          type: string
        url:
          description: URL
          type: string
      required:
        - fieldId
        - name
        - url
    2w26g39c3ibq:
      allOf:
        - $ref: "#/components/schemas/MicroCMSContentBase"
        - type: object
          properties:
            id:
              type: string
              description: コンテンツID
            title:
              description: タイトル
              type: string
            content:
              description: 本文 (HTML)
              type: string
          required:
            - id
            - title
            - content
    2w26g39c3ibqListResponse:
      type: object
      description: 2w26g39c3ibq 一覧レスポンス
      properties:
        contents:
          type: array
          items:
            $ref: "#/components/schemas/2w26g39c3ibq"
        totalCount:
          type: integer
          description: 該当コンテンツの総件数
        offset:
          type: integer
          description: 現在の取得オフセット
        limit:
          type: integer
          description: 1ページあたりの取得件数
      required:
