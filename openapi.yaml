            - requirements
            - location
            - open
    RecruitListResponse:
      type: object
      description: recruit 一覧レスポンス
      properties:
        contents:
          type: array
          items:
            $ref: "#/components/schemas/Recruit"
        totalCount:
          type: integer
          description: 該当コンテンツの総件数
        offset:
          type: integer
          description: 現在の取得オフセット
        limit:
          type: integer
          description: 1ページあたりの取得件数
      required:
        - contents
        - totalCount
        - offset
        - limit
    Tags:
      allOf:
        - $ref: "#/components/schemas/MicroCMSContentBase"
        - type: object
          properties:
            id:
              type: string
              description: コンテンツID
            title:
              description: カテゴリ名
              type: string
            en:
              description: 英称
              type: string
            character:
              description: キャラクター
              type: array
              items:
                type: string
                enum:
                  - 福岡
                  - 渡邉
                  - 藤田
                  - 竹之内
                  - 駒木根・西村
                  - 福田
                  - 安倍
                  - 藤井
                  - 加納
                  - 鎌田
                  - 早田
              maxItems: 1
              default: []
            description:
              description: 説明文
              type: string
            example:
              description: 関連実績
              type: array
              items:
                $ref: "#/components/schemas/Works"
              minItems: 3
              maxItems: 3
              default: []
          required:
            - id
            - title
            - en
            - character
            - description
            - example
    TagsListResponse:
      type: object
      description: tags 一覧レスポンス
      properties:
        contents:
          type: array
          items:
            $ref: "#/components/schemas/Tags"
        totalCount:
          type: integer
          description: 該当コンテンツの総件数
        offset:
          type: integer
          description: 現在の取得オフセット
        limit:
          type: integer
          description: 1ページあたりの取得件数
      required:
        - contents
        - totalCount
        - offset
        - limit
    Works:
      allOf:
        - $ref: "#/components/schemas/MicroCMSContentBase"
        - type: object
          properties:
            id:
              type: string
              description: コンテンツID
            title:
              description: タイトル - タイトルを登録してください
              type: string
            name:
              description: 案件名 - 案件名称を入力してください
              type: string
            client:
              description: クライアント
              allOf:
                - $ref: "#/components/schemas/Client"
              nullable: true
            category:
              description: お客様カテゴリ
              type: array
              items:
                $ref: "#/components/schemas/Category"
              default: []
            tag:
              description: サービスカテゴリ
              type: array
              items:
                $ref: "#/components/schemas/Tags"
              default: []
            img:
              description: "メインビジュアル - メインビジュアル画像は1440x900になります - 推奨サイズ: 1440x900px"
              $ref: "#/components/schemas/MicroCMSImage"
            description:
              description: メイン説明文 - キャッチコピー説明文
              type: string
            descriptionSub:
              description: サブ説明文
              type: string
            provided:
              description: 提供内容
              type: string
            url:
              description: サービスのURL
              nullable: true
              type: string
            construction:
              description: 構築期間
              nullable: true
              type: string
            launch:
              description: ローンチ時期 - ※日付のみ指定 (時刻は00:00:00 UTC)
              type: string
              format: date-time
            ended:
              description: 提供終了時期 - ※日付のみ指定 (時刻は00:00:00 UTC)
              nullable: true
              type: string
              format: date-time
            content:
              x-custom-classes:
                - name: ハイライト
                  value: highlight
                - name: 文字強調
                  value: textLarge
                - name: 外部リンク
                  value: externalLink
                - name: SPでも強制改行
                  value: spbr
                - name: マージンボトム20px
                  value: mb20
                - name: マージンボトム30px
                  value: mb30
                - name: マージンボトム40px
                  value: mb40
                - name: マージントップ20px
                  value: mt20
                - name: マージントップ30px
                  value: mt30
                - name: マージントップ40px
                  value: mt40
              description: "本文 - カスタムクラス: highlight (ハイライト), textLarge (文字強調), externalLink
                (外部リンク), spbr (SPでも強制改行), mb20 (マージンボトム20px), mb30
                (マージンボトム30px), mb40 (マージンボトム40px), mt20 (マージントップ20px), mt30
                (マージントップ30px), mt40 (マージントップ40px) (HTML)"
              type: string
            related:
              description: 関連実績
              type: array
              items:
                $ref: "#/components/schemas/Works"
              minItems: 0
              maxItems: 4
              default: []
          required:
            - id
            - title
            - name
            - client
            - category
            - tag
            - img
            - description
            - descriptionSub
            - provided
            - launch
            - content
    WorksListResponse:
      type: object
      description: works 一覧レスポンス
      properties:
        contents:
          type: array
          items:
            $ref: "#/components/schemas/Works"
        totalCount:
          type: integer
          description: 該当コンテンツの総件数
        offset:
          type: integer
          description: 現在の取得オフセット
        limit:
          type: integer
          description: 1ページあたりの取得件数
      required:
        - contents
        - totalCount
        - offset
        - limit
  parameters:
    limitParam:
      name: limit
      in: query
      description: 取得件数 (0〜100)
      schema:
        type: integer
        minimum: 0
        maximum: 100
        default: 10
    offsetParam:
      name: offset
      in: query
      description: 取得開始位置 (0以上)
      schema:
        type: integer
        minimum: 0
        default: 0
    depthParam:
      name: depth
      in: query
      description: リレーション展開の深さ (0〜3)
      schema:
        type: integer
        minimum: 0
        maximum: 3
        default: 1
    ordersParam:
      name: orders
      in: query
      description: "並び順 (例: -publishedAt, publishedAt,-updatedAt, system:default)"
      schema:
        type: string
    qParam:
      name: q
      in: query
      description: キーワード検索（複数フィールドを対象とした全文検索）
      schema:
        type: string
    fieldsParam:
      name: fields
      in: query
      description: "取得するフィールドの絞り込み（カンマ区切り、例: title,main_image,author.name）"
      schema:
        type: string
    filtersParam:
      name: filters
      in: query
      description: 条件絞り込み (equals, not_equals, contains, not_contains, less_than,
        greater_than, exists, not_exists, begins_with, [and], [or])
      schema:
        type: string
    idsParam:
      name: ids
      in: query
      description: 複数コンテンツIDのカンマ区切りリスト (最大50件)
      schema:
        type: string
    draftKeyParam:
      name: draftKey
      in: query
      description: 下書きプレビュー用キー
      schema:
        type: string
    richEditorFormatParam:
      name: richEditorFormat
      in: query
      description: 旧リッチエディタの出力形式
      schema:
        type: string
        enum:
          - html
          - object
        default: html
  responses:
    BadRequest:
      description: リクエストパラメータ不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MicroCMSError"
    Unauthorized:
      description: APIキー不正・未設定
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MicroCMSError"
    NotFound:
      description: コンテンツが見つかりません（または非公開・下書き）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MicroCMSError"
    TooManyRequests:
      description: APIレート制限超過
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MicroCMSError"
security:
  - XApiKey: []
